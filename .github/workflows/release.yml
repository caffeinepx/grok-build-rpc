name: release

# Push a tag like v0.1.0 (matching Cargo.toml's version) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset=grok-rpc-${{ matrix.arch }}-linux
          mkdir dist
          cp target/${{ matrix.target }}/release/grok-rpc dist/$asset
          cd dist && sha256sum $asset > $asset.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: grok-rpc-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
